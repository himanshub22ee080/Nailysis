name: Nailysis
description: A clean medical screening app for non-invasive anemia device

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # UI Components
  cupertino_icons: ^1.0.2

  # Charts
  fl_chart: ^0.68.0

  # Navigation
  go_router: ^12.1.3

  # Image handling
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1

  # Fonts
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
