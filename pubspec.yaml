name: Nailysis
description: A clean medical screening app for non-invasive anemia device

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & UI
  provider: ^6.1.1
  cupertino_icons: ^1.0.2
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0

  # Navigation & Utilities
  go_router: ^12.1.3
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.2.1

  # NEW: Camera and File System
  camera: ^0.11.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # NEW: Networking
  http: ^1.2.1
  http_parser: ^4.0.2
  supabase_flutter: ^2.10.3
  flutter_dotenv: ^6.0.0
  mjpeg_stream: ^1.0.1 # MJPEG streaming package (supports headers via controller)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
    - assets/.env
